name: Find Leads

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: 'Keyword (e.g. "luxury private jet charter company")'
        required: true
        type: string
      state:
        description: 'State (e.g. "Texas")'
        required: true
        type: string

permissions:
  contents: write

jobs:
  find-leads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run lead finder
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python find_leads.py "${{ inputs.keyword }}" "${{ inputs.state }}"

      - name: Commit updated seen_domains.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_domains.json
          git diff --staged --quiet || git commit -m "Update seen domains ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push
